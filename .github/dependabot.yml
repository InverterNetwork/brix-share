version: 2
updates:
  # @playwright/test updates also need the image in web/scripts/e2e-docker.sh (docs/DECISIONS.md, 2026-11-12).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      exclude: ['@inverternetwork/*']
    groups:
      platform-cdk:
        patterns: ['@inverternetwork/platform-cdk']
      aws-sdk:
        patterns: ['@aws-sdk/*']
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*']
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
