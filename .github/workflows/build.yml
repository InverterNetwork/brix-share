name: build

# Builds the web app twice from two independent checkouts and fails if the outputs differ (reproducible
# build, PLAN section 11). Uploads the manifest (SHA-256 of every served file) as an artifact.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-twice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: a
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: b
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: a/.nvmrc
      - run: corepack enable
      - name: Build in a/ and b/
        run: |
          for d in a b; do
            (cd "$d" && pnpm install --frozen-lockfile && pnpm --filter @brix-share/web build)
            node --experimental-strip-types --disable-warning=ExperimentalWarning "$d/scripts/manifest.ts" "$d/web/dist" "$GITHUB_REF_NAME" "$GITHUB_SHA" > "manifest-$d.json"
          done
      - name: Compare
        run: |
          diff <(jq -S .files manifest-a.json) <(jq -S .files manifest-b.json)
          cp manifest-a.json manifest.json
          jq -r '.files | to_entries[] | "\(.value)  \(.key)"' manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifest
          path: manifest.json
          retention-days: 30
