name: monitor

# External change monitor (PLAN section 11): compares what each live stage serves (files and headers)
# with the release recorded in DEPLOYED_<STAGE>. Needs no AWS access. Not proof of absence: a host can
# serve different content to different clients; scripts/verify-live.ts from a laptop is the spot check.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Stage config
        # Only the public facts the monitor needs (domain, region, files bucket suffix), written by
        # scripts/deploy-infra.sh. Never pass STAGES_JSON to a workflow: Actions prints step env in the log.
        env:
          MONITOR_STAGES: ${{ vars.MONITOR_STAGES }}
        run: printf '%s\n' "$MONITOR_STAGES" > infra/stages.json
      - name: Check live stages
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_PROD: ${{ vars.DEPLOYED_PROD }}
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/monitor.ts
      - name: Alert Slack
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -fsS -X POST -H 'content-type: application/json' \
              --data "{\"text\":\"Brix Share monitor failed: the live site differs from the deployed release or is down. $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
              "$SLACK_WEBHOOK_URL"
          fi
